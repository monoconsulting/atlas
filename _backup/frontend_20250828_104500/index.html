<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Task Management</title>
    <link href="/static/tailwind.css" rel="stylesheet">
    <style>
        .spinner-animation {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Header Section -->
    <header class="bg-blue-900 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">Atlas – <span id="project-name">Loading...</span></h1>
                <p class="text-blue-200 text-sm" id="working-directory">Working directory loading...</p>
            </div>
            <div data-testid="header-counters" class="flex space-x-4 text-sm">
                <span data-testid="counter-backlog" class="bg-blue-800 px-2 py-1 rounded">Backlog: <span id="count-backlog">0</span></span>
                <span data-testid="counter-todo" class="bg-blue-800 px-2 py-1 rounded">Todo: <span id="count-todo">0</span></span>
                <span data-testid="counter-inprogress" class="bg-blue-800 px-2 py-1 rounded">In progress: <span id="count-inprogress">0</span></span>
                <span data-testid="counter-review" class="bg-blue-800 px-2 py-1 rounded">Review: <span id="count-review">0</span></span>
                <span data-testid="counter-done" class="bg-blue-800 px-2 py-1 rounded">Done: <span id="count-done">0</span></span>
                <span data-testid="counter-deferred" class="bg-blue-800 px-2 py-1 rounded">Deferred: <span id="count-deferred">0</span></span>
                <span data-testid="counter-cancelled" class="bg-blue-800 px-2 py-1 rounded">Cancelled: <span id="count-cancelled">0</span></span>
            </div>
        </div>
    </header>

    <!-- Action Buttons Row -->
    <div class="bg-white border-b border-gray-300 p-4">
        <div class="container mx-auto flex space-x-4">
            <button id="create-new-task-btn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">Create New Task</button>
            <button id="create-new-status-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Create New Status</button>
            <button id="create-new-tag-btn" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded">Create New Tag</button>
        </div>
    </div>

    <!-- Filter Row -->
    <div data-testid="filter-bar" class="bg-blue-900 text-white p-4">
        <div class="container mx-auto flex items-center space-x-4">
            <!-- Status Filter -->
            <div data-testid="filter-status" class="flex items-center space-x-2">
                <label class="text-sm font-medium">Status:</label>
                <select id="status-filter" class="text-black px-2 py-1 rounded text-sm">
                    <option value="">All</option>
                    <option value="pending">Backlog</option>
                    <option value="todo">Todo</option>
                    <option value="in-progress">In progress</option>
                    <option value="review">Review</option>
                    <option value="done">Done</option>
                    <option value="deferred">Deferred</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>

            <!-- Priority Filter -->
            <div data-testid="filter-priority" class="flex items-center space-x-2">
                <label class="text-sm font-medium">Priority:</label>
                <select id="priority-filter" class="text-black px-2 py-1 rounded text-sm">
                    <option value="">All</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
            </div>

            <!-- Tags Filter -->
            <div data-testid="filter-tags" class="flex items-center space-x-2">
                <label class="text-sm font-medium">Tags:</label>
                <select id="tags-filter" class="text-black px-2 py-1 rounded text-sm">
                    <option value="">All Tags</option>
                </select>
            </div>

            <!-- Sorting -->
            <div data-testid="filter-sorting" class="flex items-center space-x-2">
                <label class="text-sm font-medium">Sort:</label>
                <select id="sort-filter" class="text-black px-2 py-1 rounded text-sm">
                    <option value="id-asc">ID (Low to High)</option>
                    <option value="id-desc">ID (High to Low)</option>
                    <option value="priority-desc">Priority (High to Low)</option>
                    <option value="priority-asc">Priority (Low to High)</option>
                </select>
            </div>

            <!-- Search -->
            <div data-testid="filter-search" class="flex items-center space-x-2">
                <label class="text-sm font-medium">Search:</label>
                <input type="text" id="search-filter" placeholder="Search tasks..." 
                       class="text-black px-2 py-1 rounded text-sm w-48">
            </div>
        </div>
    </div>

    <!-- Error Banner (hidden by default) -->
    <div data-testid="error-banner" class="bg-red-600 text-white p-4 hidden">
        <div class="container mx-auto">
            <p id="error-message">An error occurred while loading data.</p>
        </div>
    </div>

    <!-- Main Kanban Container -->
    <main class="container mx-auto p-4 relative">
        <!-- Spinner Overlay -->
        <div data-testid="spinner" class="overlay hidden">
            <div class="spinner-animation border-4 border-blue-200 border-t-4 border-t-blue-600 rounded-full w-12 h-12"></div>
        </div>

        <!-- Kanban Board -->
        <div id="kanban-board" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 xl:grid-cols-7 gap-6">
            <!-- Dynamic columns will be generated here -->
        </div>
    </main>

    <!-- Task Modal (hidden by default) -->
    <div data-testid="task-modal" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl w-full max-w-4xl max-h-screen overflow-y-auto">
                <!-- Modal content will be generated here -->
            </div>
        </div>
    </div>

    <!-- JavaScript Modules -->
    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
