
services:
  atlas:
    build: .
    container_name: ${CONTAINER_NAME:-atlas}
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8194}:8000"
    volumes:
      - "${PROJECTS_HOST_DIR}:/projects"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    depends_on:
      - mysql
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.atlas-api.rule=Host(`api.atlas.localhost`)"
      - "traefik.http.services.atlas-api.loadbalancer.server.port=8000"
    networks:
      - web
      - proxy

  webserver:
    build: .
    container_name: ${WEB_CONTAINER_NAME:-atlas_web}
    working_dir: /projects/atlas/web
    command: python server.py
    ports:
      - "${WEB_HOST_PORT:-9652}:9652"
    volumes:
      - "${PROJECTS_HOST_DIR}:/projects"
    restart: unless-stopped
    depends_on:
      - atlas
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.atlas-hub.rule=Host(`atlas.localhost`)"
      - "traefik.http.services.atlas-hub.loadbalancer.server.port=9652"
    networks:
      - web
      - proxy

  mysql:
    image: mysql:8.0
    container_name: ${MYSQL_CONTAINER_NAME:-atlas_mysql}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taskmaster}
      MYSQL_USER: ${MYSQL_USER:-tmuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tmpassword}
    ports:
      - "${MYSQL_HOST_PORT:-33066}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - web
      - proxy

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ${PHPMYADMIN_CONTAINER_NAME:-atlas_phpmyadmin}
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "8086:80"
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - web
      - proxy

networks:
  web:
    external: true
  proxy:
    external: true

volumes:
  mysql-data:
