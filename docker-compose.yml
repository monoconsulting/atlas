
services:
  taskmasterweb:
    build: .
    container_name: ${CONTAINER_NAME:-taskmasterweb}
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8199}:8000"
    volumes:
      - "${PROJECTS_HOST_DIR}:/projects"
    depends_on:
      - mysql
    restart: unless-stopped

  webserver:
    build: .
    container_name: ${WEB_CONTAINER_NAME:-taskmasterweb_webserver}
    working_dir: /projects/taskmasterweb/web
    command: python server.py
    ports:
      - "${WEB_HOST_PORT:-9652}:9652"
    volumes:
      - "${PROJECTS_HOST_DIR}:/projects"
    restart: unless-stopped
    depends_on:
      - taskmasterweb

  mysql:
    image: mysql:8.0
    container_name: ${MYSQL_CONTAINER_NAME:-taskmasterweb_mysql}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taskmaster}
      MYSQL_USER: ${MYSQL_USER:-tmuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tmpassword}
    ports:
      - "${MYSQL_HOST_PORT:-33066}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ${PHPMYADMIN_CONTAINER_NAME:-taskmasterweb_phpmyadmin}
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "8086:80"
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  mysql-data:
