        <!-- Task Management Controls -->
        <div class="bg-slate-950 rounded-lg border border-slate-800 p-4">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-medium text-slate-100">📋 Task Management</h2>
                <button 
                    id="createTaskBtn" 
                    class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors flex items-center gap-2"
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    Create Task
                </button>
            </div>

            <!-- Control Row -->
            <div class="grid grid-cols-1 md:grid-cols-6 gap-3">
                <!-- Priority Filter -->
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Priority</label>
                    <select id="filterPriority" class="w-full px-2 py-1 bg-slate-900 border border-slate-700 rounded text-slate-100 text-sm">
                        <option value="">All Priorities</option>
                        <option value="high">🔴 High</option>
                        <option value="medium">🟡 Medium</option>
                        <option value="low">🔵 Low</option>
                    </select>
                </div>

                <!-- Tag Filter -->
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Tag</label>
                    <select id="filterTag" class="w-full px-2 py-1 bg-slate-900 border border-slate-700 rounded text-slate-100 text-sm">
                        <option value="">Loading tags...</option>
                    </select>
                </div>

                <!-- Sorting -->
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Sort By</label>
                    <select id="sortBy" class="w-full px-2 py-1 bg-slate-900 border border-slate-700 rounded text-slate-100 text-sm">
                        <option value="id">ID</option>
                        <option value="priority">Priority</option>
                        <option value="title">Title</option>
                        <option value="status">Status</option>
                    </select>
                </div>

                <!-- Add Status Button -->
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Status</label>
                    <button 
                        id="addStatusBtn" 
                        class="w-full px-2 py-1 bg-green-600 hover:bg-green-700 text-white text-sm rounded transition-colors"
                    >
                        + Add Status
                    </button>
                </div>

                <!-- Add Tag Button -->
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Tags</label>
                    <button 
                        id="addTagBtn" 
                        class="w-full px-2 py-1 bg-purple-600 hover:bg-purple-700 text-white text-sm rounded transition-colors"
                    >
                        + Add Tag
                    </button>
                </div>

                <!-- Search -->
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Search</label>
                    <input 
                        type="text" 
                        id="searchTasks" 
                        placeholder="Search tasks..."
                        class="w-full px-2 py-1 bg-slate-900 border border-slate-700 rounded text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>
            </div>

            <!-- Status Filter Row -->
            <div class="mt-4 pt-4 border-t border-slate-800">
                <div class="flex items-center justify-between mb-3">
                    <label class="text-sm font-medium text-slate-300">Status Filters</label>
                    <div class="flex gap-2">
                        <button id="clearFilters" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs rounded transition-colors">
                            Clear All
                        </button>
                        <button id="selectAllStatuses" class="px-2 py-1 bg-blue-600 hover:bg-blue-700 text-white text-xs rounded transition-colors">
                            Select All
                        </button>
                    </div>
                </div>
                <div id="statusFiltersContainer" class="flex flex-wrap gap-2">
                    <!-- Dynamic status filters will be populated here -->
                </div>
            </div>

            <!-- Filter Summary -->
            <div id="filterSummary" class="mt-4 pt-4 border-t border-slate-800">
                <div class="flex items-center justify-between text-sm">
                    <span class="text-slate-400">
                        Showing: <span id="filteredTaskCount" class="text-green-400 font-semibold">0</span> / <span id="totalTaskCount" class="text-blue-400 font-semibold">0</span> tasks
                    </span>
                    <div id="activeTagDisplay" class="text-slate-300">
                        Current Tag: <span id="currentTagName" class="text-yellow-400 font-medium">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
