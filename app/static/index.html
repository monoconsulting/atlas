<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas-TM - Loading...</title>
    <link href="/static/tailwind.css" rel="stylesheet">
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">
    <!-- Header -->
    <header class="bg-gradient-to-r from-slate-900 via-blue-900 to-slate-900 border-b border-slate-700 sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-gradient-to-br from-blue-400 to-purple-500 rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
                        </svg>
                    </div>
                    <div class="flex flex-col">
                        <h1 id="projectName" class="text-2xl font-bold text-slate-100">Loading...</h1>
                        <div class="text-sm text-slate-400 font-normal">
                            <span class="bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">Atlas</span>
                            <span> - Taskmaster Web</span>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <a href="http://localhost:9652" target="_blank" 
                        class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium rounded-lg transition-all duration-200 flex items-center gap-2 shadow-sm hover:shadow-md">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2V7"></path>
                        </svg>
                        Dev Hub
                    </a>
                    <a id="projectPageLink" href="#" target="_blank" 
                        class="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white text-sm font-medium rounded-lg transition-all duration-200 flex items-center gap-2 shadow-sm hover:shadow-md">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                        Project
                    </a>
                </div>
            </div>
            <div data-testid="header-counters" class="flex items-center gap-3 text-sm">
                <span data-testid="counter-backlog" class="bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-600 text-slate-300 backdrop-blur-sm">
                    Backlog: <span class="text-slate-100 font-semibold">0</span>
                </span>
                <span data-testid="counter-todo" class="bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-600 text-slate-300 backdrop-blur-sm">
                    Todo: <span class="text-slate-100 font-semibold">0</span>
                </span>
                <span data-testid="counter-inprogress" class="bg-blue-800/80 px-3 py-1.5 rounded-lg border border-blue-600 text-blue-200 backdrop-blur-sm">
                    In progress: <span class="text-blue-100 font-semibold">0</span>
                </span>
                <span data-testid="counter-review" class="bg-yellow-800/80 px-3 py-1.5 rounded-lg border border-yellow-600 text-yellow-200 backdrop-blur-sm">
                    Review: <span class="text-yellow-100 font-semibold">0</span>
                </span>
                <span data-testid="counter-done" class="bg-green-800/80 px-3 py-1.5 rounded-lg border border-green-600 text-green-200 backdrop-blur-sm">
                    Done: <span class="text-green-100 font-semibold">0</span>
                </span>
                <span data-testid="counter-deferred" class="bg-orange-800/80 px-3 py-1.5 rounded-lg border border-orange-600 text-orange-200 backdrop-blur-sm">
                    Deferred: <span class="text-orange-100 font-semibold">0</span>
                </span>
                <span data-testid="counter-cancelled" class="bg-red-800/80 px-3 py-1.5 rounded-lg border border-red-600 text-red-200 backdrop-blur-sm">
                    Cancelled: <span class="text-red-100 font-semibold">0</span>
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-4">
        <!-- Action Buttons -->
        <div class="mb-6 flex gap-3">
            <button id="createNewTaskBtn" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-medium transition-all duration-200 shadow-sm hover:shadow-md flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Create New Task
            </button>
            <button id="createNewStatusBtn" class="px-5 py-2.5 bg-green-600 hover:bg-green-500 text-white rounded-lg font-medium transition-all duration-200 shadow-sm hover:shadow-md flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                Create New Status
            </button>
            <button id="createNewTagBtn" class="px-5 py-2.5 bg-purple-600 hover:bg-purple-500 text-white rounded-lg font-medium transition-all duration-200 shadow-sm hover:shadow-md flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
                </svg>
                Create New Tag
            </button>
        </div>

        <!-- Single Filter Row -->
        <div data-testid="filter-bar" class="bg-blue-900 rounded-lg border border-blue-800 p-4 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
                <div>
                    <label class="block text-sm font-medium text-blue-200 mb-2">Status</label>
                    <select data-testid="filter-status" id="filterStatus" class="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded text-slate-200">
                        <option value="">All Status</option>
                        <option value="pending">Backlog</option>
                        <option value="todo">Todo</option>
                        <option value="in-progress">In progress</option>
                        <option value="review">Review</option>
                        <option value="done">Done</option>
                        <option value="deferred">Deferred</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-blue-200 mb-2">Priority</label>
                    <select data-testid="filter-priority" id="filterPriority" class="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded text-slate-200">
                        <option value="">All Priority</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-blue-200 mb-2">Tags</label>
                    <select data-testid="filter-tags" id="filterTags" class="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded text-slate-200">
                        <option value="">All Tags</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-blue-200 mb-2">Sorting</label>
                    <select data-testid="filter-sorting" id="filterSorting" class="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded text-slate-200">
                        <option value="id-asc">ID ASC</option>
                        <option value="id-desc" selected>ID DESC</option>
                        <option value="priority-desc">Priority</option>
                        <option value="status-asc">Status</option>
                        <option value="title-asc">Title</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-blue-200 mb-2">Search</label>
                    <input data-testid="filter-search" type="text" id="filterSearch" placeholder="Search tasks..." 
                        class="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded text-slate-200 placeholder-slate-500">
                </div>
            </div>
            <div class="mt-4 flex justify-end">
                <button id="clearFiltersBtn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg font-medium transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                    Clear Filters
                </button>
            </div>
        </div>

        <!-- Kanban Board -->
        <div id="kanbanContainer" class="grid gap-4" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));">
            <!-- Columns will be dynamically generated here -->
        </div>
    </main>

    <!-- Spinner Overlay -->
    <div data-testid="spinner" id="spinnerOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden">
        <div class="flex items-center justify-center min-h-screen">
            <div class="bg-slate-800 rounded-lg p-6 flex items-center gap-3">
                <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-400"></div>
                <span class="text-slate-200">Loading...</span>
            </div>
        </div>
    </div>

    <!-- Error Banner -->
    <div data-testid="error-banner" id="errorBanner" class="fixed top-20 left-4 right-4 bg-red-900 border border-red-700 text-red-100 px-4 py-3 rounded-lg hidden z-40">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span id="errorMessage">An error occurred</span>
            </div>
            <button id="closeErrorBtn" class="text-red-300 hover:text-red-100">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Task Modal -->
    <div data-testid="task-modal" id="taskModal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-50 backdrop-blur-sm overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-slate-900 border border-slate-700 rounded-lg w-full max-w-2xl my-8">
                <div class="sticky top-0 bg-slate-900 border-b border-slate-700 p-6 flex items-center justify-between rounded-t-lg">
                    <h2 id="modalTitle" class="text-xl font-semibold text-slate-100">Create New Task</h2>
                    <button id="closeModalBtn" class="text-slate-400 hover:text-slate-200">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                <div class="p-6">
                    <form id="taskForm" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">Title *</label>
                                <input type="text" id="taskTitle" required 
                                    class="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">Priority</label>
                                <select id="taskPriority" 
                                    class="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                    <option value="low">Low</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="high">High</option>
                                </select>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Description</label>
                            <textarea id="taskDescription" rows="3" 
                                class="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"></textarea>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">Status</label>
                                <select id="taskStatus" 
                                    class="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                    <option value="pending">Backlog</option>
                                    <option value="todo" selected>Todo</option>
                                    <option value="in-progress">In progress</option>
                                    <option value="review">Review</option>
                                    <option value="done">Done</option>
                                    <option value="deferred">Deferred</option>
                                    <option value="cancelled">Cancelled</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">Due Date</label>
                                <input type="date" id="taskDueDate" 
                                    class="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">Assigned To</label>
                                <input type="text" id="taskAssignedTo" 
                                    class="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">Estimate</label>
                                <input type="text" id="taskEstimate" placeholder="e.g., 4h, 2d" 
                                    class="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">Labels</label>
                                <input type="text" id="taskLabels" placeholder="Comma-separated tags" 
                                    class="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            </div>
                        </div>

                        <!-- Subtasks Section -->
                        <div class="mt-6 pt-6 border-t border-slate-700">
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="text-lg font-medium text-slate-200">Subtasks</h3>
                                <button type="button" id="addSubtaskBtn"
                                    class="px-3 py-1 bg-green-600 hover:bg-green-700 text-white text-sm rounded transition-colors flex items-center gap-1">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                                    </svg>
                                    Add Subtask
                                </button>
                            </div>
                            <div id="subtasksList" class="space-y-2">
                                <p class="text-sm text-slate-500 italic">No subtasks added yet</p>
                            </div>
                        </div>

                        <div class="flex justify-end space-x-3 pt-4 border-t border-slate-700">
                            <button type="button" id="cancelTaskBtn"
                                class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded transition-colors">
                                Cancel
                            </button>
                            <button type="submit" id="saveTaskBtn"
                                class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded transition-colors">
                                Save Task
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Modules -->
    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
