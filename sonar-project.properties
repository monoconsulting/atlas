# SonarQube Configuration for TaskMasterWeb
sonar.projectKey=tm-taskmasterweb
sonar.projectName=TaskMasterWeb
sonar.projectVersion=1.0

# Source code directories
sonar.sources=.

# Exclusions - files and directories to ignore during analysis
sonar.exclusions=**/node_modules/**,\
    **/test-results/**,\
    **/test-reports/**,\
    **/_backup/**,\
    **/legacy/**,\
    **/*.min.js,\
    **/dist/**,\
    **/build/**,\
    **/.git/**,\
    **/.taskmaster/**,\
    **/venv/**,\
    **/__pycache__/**,\
    **/coverage/**,\
    **/playwright-report/**

# Test file patterns
sonar.test.inclusions=**/*test.js,**/*spec.js,**/tests/**,**/*test.py,**/*_test.py

# Language-specific settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results/*.xml

# Additional settings
sonar.sourceEncoding=UTF-8
sonar.host.url=http://atlas_sonarqube:9000
